<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>STARK TECH | Official Launch</title>
<style>
:root{color-scheme:dark;--black:#08090d;--gold:#c9a448;--blue:#087dff;--steel:#252a32;--muted:#a9adb6}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--black);color:#f4f2ed;font-family:Inter,Arial,sans-serif;overflow:hidden}
.launch{position:relative;width:100%;height:100svh;min-height:540px;isolation:isolate;background:radial-gradient(ellipse at 50% 48%,#17202a 0,#0b0e14 43%,#050609 100%);overflow:hidden}
.stars{position:absolute;inset:0;opacity:.23;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at center,#000,transparent 78%)}
.topline{position:absolute;z-index:8;top:28px;left:5vw;right:5vw;display:flex;justify-content:space-between;align-items:center;color:#a9adb6;font-size:10px;letter-spacing:.25em}.topline b{color:var(--gold);font-weight:600}
.hangar{position:absolute;inset:0;perspective:1600px;display:grid;place-items:stretch}
.portal{position:absolute;inset:0;width:100%;height:100%;min-height:0;border:0;box-shadow:none;overflow:hidden;background:linear-gradient(180deg,#121820,#07090e)}
.portal:before,.portal:after{content:none;display:none}
.inner-light{position:absolute;inset:0;background:radial-gradient(ellipse at center,#c9a44830 0,#087dff1c 26%,transparent 66%);opacity:0;transition:opacity 1.5s}
.door{position:absolute;z-index:3;top:0;bottom:0;width:50%;background:linear-gradient(145deg,#59616b 0%,#303944 8%,#171d26 22%,#343d48 48%,#151b23 72%,#39434e 94%,#10151c 100%);border:2px solid #68727e;box-shadow:inset 0 0 0 7px #090d13,inset 0 0 0 10px #59636e,inset 0 0 42px #000,0 0 28px #000;transition:transform 2.5s cubic-bezier(.7,0,.15,1);overflow:hidden}
.door.left{left:0;border-right:4px solid #090b10}.door.right{right:0;border-left:4px solid #090b10}
.door:before{content:"";position:absolute;z-index:0;inset:2.5%;background:linear-gradient(180deg,#ffffff16,transparent 16%,#0005 84%,#ffffff0a),repeating-linear-gradient(0deg,transparent 0 18%,#080c12 18.2%,#59636e 18.6%,transparent 19.1%),linear-gradient(135deg,#39434f,#171d26 42%,#303944 68%,#111720);border:3px solid #697582;box-shadow:inset 0 0 0 5px #10151d,inset 0 0 0 8px #3e4853,inset 0 0 35px #000;clip-path:polygon(0 0,91% 0,100% 8%,100% 92%,91% 100%,0 100%)}
.door:after{content:"";position:absolute;z-index:1;inset:13% 9%;border:2px solid #7b8794;background:linear-gradient(145deg,#ffffff12,transparent 22%,#0004 70%),repeating-linear-gradient(0deg,transparent 0 48%,#090e15 49%,#606b77 50%,transparent 51%);box-shadow:inset 0 0 0 5px #111720,inset 0 0 24px #000,0 0 0 5px #111720;clip-path:polygon(0 0,88% 0,100% 12%,100% 88%,88% 100%,0 100%)}
.door.right:before,.door.right:after{transform:scaleX(-1)}
.door>*{z-index:2}
.armor{position:absolute;top:8%;bottom:8%;width:23%;background:linear-gradient(90deg,#080b10 0%,#202833 16%,#65717e 42%,#303a45 58%,#111720 100%);border:2px solid #84909d;box-shadow:inset 0 0 0 4px #111720,inset 0 0 24px #000,0 0 14px #000;clip-path:polygon(0 0,100% 0,100% 94%,88% 100%,0 100%)}
.left .armor{right:8%}.right .armor{left:8%}
.bolt.c{top:6%;left:auto;right:7%}.bolt.d{top:auto;bottom:6%;left:7%;right:auto}
.rib{position:absolute;top:0;bottom:0;width:5px;background:linear-gradient(transparent,#c9a448,#f2d78b,#c9a448,transparent);box-shadow:0 0 14px #c9a44877}
.left .rib{right:4%}.right .rib{left:4%}
.panel-lines{position:absolute;inset:25% 12%;border:2px solid #8a96a2;background:linear-gradient(135deg,#ffffff10,transparent 28%,#0005),linear-gradient(180deg,#29333e,#151c25 55%,#303a45);box-shadow:inset 0 0 0 5px #111720,inset 0 0 28px #000,0 0 0 4px #0a0e14;clip-path:polygon(0 0,86% 0,100% 16%,100% 84%,86% 100%,0 100%)}
.right .panel-lines{transform:scaleX(-1)}
.hazard{position:absolute;bottom:10%;left:8%;right:8%;height:8px;background:repeating-linear-gradient(135deg,var(--gold) 0 12px,#161a20 12px 24px);opacity:.8}
.bolt{position:absolute;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#f1f4f7 0,#9da8b2 18%,#48525d 48%,#0b0f15 76%);border:1px solid #9ba6b0;box-shadow:0 0 0 4px #10151c,0 2px 8px #000;top:6%;z-index:4}.bolt.a{left:7%}.bolt.b{right:7%;top:auto;bottom:6%}
.lockbar{position:absolute;z-index:4;top:50%;width:22px;height:150px;transform:translateY(-50%);background:linear-gradient(90deg,#0b0e13,#69717b 45%,#151a20);border:1px solid #9ba3aa66;box-shadow:0 0 14px #000}.lockbar.l{left:49%}.lockbar.r{right:49%}
.lock-core{position:absolute;z-index:5;left:50%;top:50%;width:68px;height:68px;transform:translate(-50%,-50%);border:2px solid var(--gold);background:radial-gradient(circle,#1d2630,#080a0e 70%);box-shadow:0 0 30px #c9a44855,inset 0 0 18px #087dff44;display:grid;place-items:center;color:var(--gold);font-size:22px}
.brand-reveal{position:absolute;z-index:2;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;opacity:0;transform:scale(1.16);transition:opacity 1.3s .7s,transform 1.8s .7s;pointer-events:none}
.brand-reveal img{width:clamp(100px,15vw,190px);height:auto;max-height:180px;object-fit:contain;filter:drop-shadow(0 0 25px #c9a44866)}
.brand-reveal h1{font-size:clamp(28px,5vw,58px);letter-spacing:.18em;margin:22px 0 8px;font-weight:600}
.brand-reveal p{color:var(--gold);font-size:clamp(9px,1.2vw,13px);letter-spacing:.34em;margin:0}
.caption{position:absolute;z-index:8;bottom:8%;left:0;right:0;text-align:center;color:#b7bbc2;font-size:10px;letter-spacing:.28em}
.action{position:absolute;z-index:10;left:50%;bottom:15%;transform:translateX(-50%);border:1px solid var(--gold);background:linear-gradient(135deg,#c9a448,#92702c);color:#090a0d;padding:17px 28px;font-weight:700;letter-spacing:.2em;font-size:11px;cursor:pointer;box-shadow:0 0 30px #c9a44822;transition:transform .2s,box-shadow .2s;white-space:nowrap}
.action:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 0 38px #c9a44866}
.skip{position:absolute;z-index:10;right:5vw;bottom:28px;color:#a9adb6;text-decoration:none;font-size:10px;letter-spacing:.15em;border-bottom:1px solid #69717b;padding-bottom:5px}
.status{position:absolute;z-index:8;left:5vw;bottom:28px;color:#8e96a2;font-size:9px;letter-spacing:.2em}
.launch.opening .door.left{transform:translateX(-102%)}.launch.opening .door.right{transform:translateX(102%)}
.launch.opening .lockbar,.launch.opening .lock-core{opacity:0;transition:opacity .3s}
.launch.opening .inner-light{opacity:1}
.launch.opening .brand-reveal{opacity:1;transform:scale(1)}
.launch.opening .action,.launch.opening .caption{opacity:0;pointer-events:none}
.launch.entered .brand-reveal{transform:scale(.12) translateY(-250%);opacity:0;transition:transform 1.2s,opacity .8s}
.site-frame{position:absolute;z-index:20;inset:0;background:#080b12;opacity:0;pointer-events:none;transition:opacity 1.1s}
.site-frame iframe{width:100%;height:100%;border:0}
.launch.entered .site-frame{opacity:1;pointer-events:auto;transition-delay:1s}
@media(max-width:650px){.hangar{inset:0}.portal{inset:0;width:100%;height:100%;min-height:0}.topline{top:18px;font-size:8px}.action{bottom:18%;padding:15px 18px;font-size:9px}.caption{bottom:10%;font-size:8px}.status{bottom:18px}.skip{bottom:18px}.lockbar{height:110px}.brand-reveal p{letter-spacing:.2em}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<main class="launch" id="launch">
<div class="stars"></div>
<div class="topline"><span><b>STARK TECH</b> / SYSTEMS ACCESS</span><span>13 · 11 · 2026</span></div>
<div class="hangar">
<div class="portal">
<div class="inner-light"></div>
<div class="brand-reveal"><img src="assets/stark-tech-emblem.png.png" alt="STARK TECH official emblem"><h1>STARK TECH</h1><p>SOLUTIONS BEYOND IMAGINATION</p></div>
<div class="door left"><div class="armor"></div><div class="rib"></div><div class="panel-lines"></div><div class="hazard"></div><i class="bolt a"></i><i class="bolt b"></i><i class="bolt c"></i><i class="bolt d"></i></div>
<div class="door right"><div class="armor"></div><div class="rib"></div><div class="panel-lines"></div><div class="hazard"></div><i class="bolt a"></i><i class="bolt b"></i></div>
<div class="lockbar l"></div><div class="lockbar r"></div><div class="lock-core">✦</div>
</div>
</div>
<div class="caption">SECURE ENGINEERING FACILITY · ACCESS SEQUENCE READY</div>
<div class="status" id="status">SYSTEM STATUS: STANDBY</div>
<button class="action" id="launchButton">INITIATE LAUNCH</button>
<a class="skip" href="index.html">SKIP INTRO ↗</a>
<div class="site-frame"><iframe title="STARK TECH website" src="index.html"></iframe></div>
</main>
<script>
const stage=document.getElementById('launch'),button=document.getElementById('launchButton'),status=document.getElementById('status');
button.addEventListener('click',()=>{if(stage.classList.contains('opening'))return;status.textContent='SYSTEM STATUS: AUTHORIZATION ACCEPTED';button.textContent='ACCESS GRANTED';stage.classList.add('opening');setTimeout(()=>{status.textContent='SYSTEM STATUS: FACILITY OPEN';},1700);setTimeout(()=>{stage.classList.add('entered');status.textContent='STARK TECH // ONLINE';},4300);});
</script>
</body>
</html>
